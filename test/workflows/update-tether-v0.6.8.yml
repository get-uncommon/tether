# Keeps this deployed copy of tether-sync up to date, like a jsDelivr version range.
# Set the range in the TETHER_VERSION file: `0.3` (patches only, default), `0.3.3` (pinned) or `latest`.
# Runs every Monday, or now: Actions -> Update Tether -> Run workflow. Cloudflare redeploys on the push.
# Only the code changes; tether-sync.config.js, wrangler.jsonc and TETHER_VERSION are kept.
name: Update Tether

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to keep this schedule alive (below)

concurrency:
  group: update-tether
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GitHub switches off scheduled workflows in public repos after 60 days without activity.
      # Re-enabling the workflow through the API resets that, so updates never silently stop.
      - name: Keep the weekly schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update-tether.yml/enable" || echo "could not re-enable (fine for private repos)"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Find and apply the newest matching release
        id: up
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-tether.mjs | tee update.log
          echo "version=$(grep '^updated=' update.log | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          rm update.log
      - name: Test the new version before it goes live
        if: steps.up.outputs.version != ''
        run: |
          node --test test/*.test.js
          node -e "import('./src/entry.js').then(() => console.log('entry ok'))"
      - name: Commit (Cloudflare deploys it)
        if: steps.up.outputs.version != ''
        env:
          VERSION: ${{ steps.up.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Tether to v$VERSION"
          git push
          echo "### Updated to v$VERSION" >> "$GITHUB_STEP_SUMMARY"
