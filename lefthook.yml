# Local git hooks (https://lefthook.dev): Prettier and ESLint on staged files, the full gate (`npm run check`) before
# each push. CI runs the same gate on pull requests and pushes to main (`.github/workflows/ci.yml`).
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,mjs,cjs,ts,json,yml,yaml,html}'
      run: npx prettier --check {staged_files}
    lint:
      glob: '*.{js,mjs,cjs,ts}'
      run: npx eslint --no-warn-ignored {staged_files}
pre-push:
  commands:
    check:
      run: npm run check
