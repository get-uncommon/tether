# Keeps this deployed copy of tether-sync up to date, like a jsDelivr version range.
# Set the range in the TETHER_VERSION file: `0.3` (patches only, default), `0.3.3` (pinned) or `latest`.
# Runs every Monday, or now: Actions -> Update Tether -> Run workflow. Cloudflare redeploys on the push.
# Only the code changes; tether-sync.config.js, wrangler.jsonc and TETHER_VERSION are kept.
name: Update Tether

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to keep this schedule alive (below)
  checks: read     # to see that Cloudflare picked up the update

concurrency:
  group: update-tether
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GitHub switches off scheduled workflows in public repos after 60 days without activity.
      # Re-enabling the workflow through the API resets that, so updates never silently stop.
      - name: Keep the weekly schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update-tether.yml/enable" || echo "could not re-enable (fine for private repos)"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Find and apply the newest matching release
        id: up
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-tether.mjs | tee update.log
          echo "version=$(grep '^updated=' update.log | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          rm update.log
      - name: Test the new version before it goes live
        if: steps.up.outputs.version != ''
        run: |
          node --test test/*.test.js
          node -e "import('./src/entry.js').then(() => console.log('entry ok'))"
      - name: Commit (Cloudflare deploys it)
        if: steps.up.outputs.version != ''
        env:
          VERSION: ${{ steps.up.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Tether to v$VERSION"
          git push
          echo "### Updated to v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      # Cloudflare builds on GitHub's push notification, which can (rarely) get lost. Wait until
      # Cloudflare has started a build for the update; if it doesn't, push again once, then fail
      # loudly (GitHub emails you about failed runs) instead of staying silently on the old version.
      - name: Make sure Cloudflare deploys it
        if: steps.up.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built() { [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)/check-runs" --jq '.total_count' 2>/dev/null || echo 0)" -gt 0 ]; }
          wait_build() { for i in $(seq 1 12); do built && return 0; sleep 10; done; return 1; }
          if wait_build; then echo "Cloudflare is building it."; exit 0; fi
          echo "No Cloudflare build after 2 minutes: pushing again."
          git commit --allow-empty -m "Redeploy Tether (Cloudflare missed the last push)"
          git push
          if wait_build; then echo "Cloudflare is building it."; exit 0; fi
          echo "::error::Cloudflare didn't start a build. Open Cloudflare -> Workers & Pages -> your Worker -> Deployments, or check that the Git connection still works."
          exit 1
