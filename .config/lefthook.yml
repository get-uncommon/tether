# Local git hooks (https://lefthook.dev). Before a commit: Prettier and ESLint on the staged files, then the message's
# style (`scripts/commit-msg.ts`). Before a push, side by side: `scripts/pre-push.ts`, which reads the pushed refs on
# stdin and runs the full gate (`npm run check`), or a narrow check for a push that changes only the Astro starter's
# package files; and the workflow linters CI's `workflows` job runs (`npm run lint:workflows`). CI runs both on pull
# requests and pushes to main (`.github/workflows/ci.yml`). The linters stay out of `npm run check`: CI's `check` job,
# the release and the rehearsal run that gate too, and would download them again for every Node version.
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,mjs,cjs,ts,json,yml,yaml,html,md}'
      run: npx prettier --check {staged_files}
    lint:
      glob: '*.{js,mjs,cjs,ts}'
      run: npx eslint --no-warn-ignored {staged_files}
commit-msg:
  commands:
    style:
      run: node --experimental-strip-types scripts/commit-msg.ts {1}
pre-push:
  parallel: true
  commands:
    check:
      use_stdin: true
      run: node --experimental-strip-types scripts/pre-push.ts
    workflows:
      run: npm run lint:workflows
