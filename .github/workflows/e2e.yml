# Real-browser tests: the Astro starter in Chromium, WebKit, Firefox and a phone, against Shopify's
# public demo store. Public repos run Actions for free. Nothing is uploaded (no storage used). A pull request runs it
# when it changes what the browsers load or how the starter is built.
name: e2e

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/src/shared/**'
      - 'scripts/build.ts'
      - 'test/e2e/**'
      - 'examples/astro/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1' # Mondays: catches changes on Shopify's side
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # The install scripts (esbuild's binary check, lefthook's Git hooks) aren't needed to build or test.
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run e2e
