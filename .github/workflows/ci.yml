# The gate (`npm run check`: Prettier, ESLint, tsc, Knip, dependency-cruiser, the tests) on every pull request and
# every push to main, on the oldest Node the package supports (`engines`) and the current one. lefthook runs it
# locally too, but a hook can be skipped and a pull request from a fork never runs it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
