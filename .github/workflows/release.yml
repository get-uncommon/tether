# Publishes a release when a version tag is pushed (made by `npm run release -- X.Y.Z`):
# tests, npm publish with provenance (trusted publishing: no token in the repo), GitHub Release.
# The Release carries tether-server-X.Y.Z.tar.gz, the sync Worker's server/ folder with a GitHub artifact
# attestation from this workflow: deployed copies install an update only from that file, after
# `gh attestation verify --signer-workflow <repo>/.github/workflows/release.yml` (server/scripts/release-asset.mjs).
# Renaming this file or the asset stops every copy's updates.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # the GitHub Release
  id-token: write # npm trusted publishing + provenance, and the attestation's signing certificate
  attestations: write # the server asset's attestation

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5
      - run: npm ci
      - name: Tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME doesn't match package.json"; exit 1; }
      # npm and the Release ship the committed dist/, so it must be what this tag's source builds.
      - name: Committed dist/ matches a fresh build
        shell: bash
        run: |
          npm run build
          if ! git diff --exit-code --stat -- dist/ || [ -n "$(git status --porcelain --untracked-files=all -- dist/)" ]; then
            git status --short -- dist/
            echo "::error::dist/ differs from a fresh npm run build: rebuild and commit it"
            exit 1
          fi
      - run: npm test
      - run: npm run smoke
      # git archive of the tagged commit: the same bytes on every run (file times are the commit's), and only what
      # is committed. The top folder is stripped by the updater, which reads server/ inside it.
      - name: Server asset for the sync Worker's updates
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="tether-server-$V/" -o "tether-server-$V.tar.gz" HEAD -- server
          echo "SERVER_ASSET=tether-server-$V.tar.gz" >> "$GITHUB_ENV"
      - name: Attest the server asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.SERVER_ASSET }}
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          {
            echo; echo '**Use it:**'; echo
            echo '```html'; echo "<script src=\"https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${V%.*}/dist/tether.min.js\" defer></script>"; echo '```'; echo
            echo '```bash'; echo 'npm install @occluze/tether'; echo '```'
          } >> notes.md
          # Every script next to the core, so a site can self-host the folder: the core loads its parts from beside it.
          # dist/esm/ is left out: its chunks import each other by path, which flat Release assets don't keep.
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          gh release create "$GITHUB_REF_NAME" --title "Tether $V" --notes-file notes.md --latest "${assets[@]}" "$SERVER_ASSET"
