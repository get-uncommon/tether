<!doctype html>
<!-- A plain HTML page with the <script> build, the way Webflow uses Tether. Served from /plain/. -->
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Plain</title>
    <script>
      window.TETHER_CONFIG = {
        domain: 'hydrogen-preview.myshopify.com',
        token: '3b580e70970c4528da70c98e097c2fa0',
        country: 'NL',
        locale: 'nl-NL',
        productPath: '/plain/?handle={handle}',
        variantUrl: true,
        analytics: { dataLayer: true, shopify: window.location.search.includes('shopify=1') },
        partsUrl: '/plain/dist/',
      };
    </script>
    <script src="/plain/dist/tether.min.js" defer></script>
  </head>
  <body>
    <form tether-search action="/plain/">
      <input tether-search-input name="q" aria-label="Search" />
      <div tether-search-results>
        <div tether-search-products>
          <a><span tether-search-bind="title"></span> <span tether-search-bind="price"></span></a>
        </div>
      </div>
    </form>
    <button tether-cart-open>Cart (<span tether-cart-count>0</span>)</button>

    <div id="pdp" tether-product="url:handle">
      <h1 tether-bind="title"></h1>
      <span id="price" tether-bind="price"></span>
      <div tether-option-list="Size"><button></button></div>
      <button tether-add-to-cart>Add</button>
    </div>

    <div tether-group="Set">
      <div tether-product="the-h2-snowboard" tether-quantity="1"></div>
      <button id="add-set" tether-group-add>Add set</button>
    </div>

    <aside tether-cart-drawer>
      <button tether-cart-close>Close</button>
      <div tether-cart-lines>
        <div>
          <span tether-line="title"></span> × <span tether-line="quantity"></span> <button tether-line-plus>+</button>
        </div>
      </div>
      <button tether-checkout>Checkout</button>
    </aside>
  </body>
</html>
